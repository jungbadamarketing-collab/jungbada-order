<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>정바다 발주</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Apple SD Gothic Neo',sans-serif;background:#f7f7f5;color:#1a1a1a;font-size:15px;overscroll-behavior:none}

/* ── 헤더 ── */
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e8e8e5;padding:12px 16px 0}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header-top h1{font-size:18px;font-weight:700}
.draft-badge{font-size:11px;font-weight:600;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:20px;padding:3px 10px;display:none}
.draft-badge.show{display:inline-block}
.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;padding:9px 14px 9px 36px;border:1.5px solid #e8e8e5;border-radius:10px;font-size:14px;background:#f7f7f5;color:#1a1a1a;outline:none;font-family:inherit}
.search-input:focus{border-color:#aaa;background:#fff}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:#bbb}
.search-clear{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:16px;color:#bbb;cursor:pointer;display:none}
.tab-bar{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;font-size:14px;font-weight:600;padding:9px 14px;border:none;background:transparent;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
.tab-btn.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

/* ── 콘텐츠 ── */
.content{padding:14px;padding-bottom:100px}
.tab-content{display:none}
.tab-content.active{display:block}

/* 구역 섹션 */
.zone-section{margin-bottom:22px}
.zone-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.zone-title-wrap{display:flex;align-items:center;gap:8px}
.zone-title{font-size:15.6px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;border-radius:4px;padding:2px 4px}
.zone-title:hover{background:#f0f0ee}
.zone-title-input{font-size:15.6px;font-weight:700;border:1.5px solid #1a1a1a;border-radius:6px;padding:2px 6px;font-family:inherit;outline:none;display:none;width:140px}
.zone-save-btn{font-size:11px;padding:3px 8px;border-radius:6px;border:1.5px solid #1a1a1a;background:#1a1a1a;color:#fff;cursor:pointer;display:none}
.zone-count{font-size:12px;color:#bbb}
.zone-add-btn{font-size:12px;padding:4px 10px;border:1.5px dashed #d0d0ce;border-radius:8px;background:#fafaf8;color:#aaa;cursor:pointer;font-weight:600;font-family:inherit}

/* 카드 그리드 */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 품목 카드 */
.item-card{background:#fff;border:1.5px solid #e8e8e5;border-radius:14px;overflow:visible;position:relative}
.item-card.highlighted{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.15)}
.item-card.inactive{opacity:0.4;filter:grayscale(60%)}
.item-card.inactive .stepper{display:none}

/* D-데이 뱃지 */
.dday-badge{position:absolute;top:7px;right:7px;z-index:5;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.dday-today{background:#dc2626;color:#fff}
.dday-soon{background:#f59e0b;color:#fff}
.dday-ok{background:#16a34a;color:#fff}
.dday-first{background:#dc2626;color:#fff}

/* 평균 발주량 뱃지 */
.avg-badge{position:absolute;bottom:84px;right:7px;z-index:5;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;background:rgba(0,0,0,0.5);color:#fff;display:none}
.avg-badge.show{display:block}

/* 자동발주 뱃지 */
.auto-badge{position:absolute;top:7px;left:7px;z-index:5;font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;background:#3b82f6;color:#fff;display:none}
.auto-badge.show{display:block}

/* 이미지 */
.card-img{width:100%;aspect-ratio:1;background:#f7f7f5;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px 12px 0 0;cursor:pointer;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%}
.card-img-placeholder .emoji{font-size:28px;opacity:0.25}
.card-img-placeholder .edit-hint{font-size:11px;color:#ccc;font-weight:500}
.img-input{display:none}

/* 카드 바디 */
.card-body{padding:9px 11px 10px}
.card-name-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.card-name{font-size:13.5px;font-weight:700;color:#1a1a1a;line-height:1.3;flex:1;cursor:pointer;border-radius:4px;padding:1px 3px;margin:-1px -3px;word-break:keep-all}
.card-name:hover{background:#f0f0ee}
.card-name-edit-wrap{display:none;flex-direction:column;gap:5px;margin-bottom:4px}
.card-name-edit-wrap.show{display:flex}
.card-name-input-edit{font-size:13.5px;font-weight:700;border:1.5px solid #1a1a1a;border-radius:6px;padding:4px 7px;font-family:inherit;outline:none;width:100%}
.name-save-btn{font-size:12px;padding:4px 10px;border-radius:7px;border:none;background:#1a1a1a;color:#fff;cursor:pointer;font-family:inherit;align-self:flex-end}

/* 업체/단위 편집 */
.card-edit-row{display:flex;align-items:center;gap:4px;margin-bottom:7px}
.card-vendor-unit-text{font-size:11.5px;color:#bbb;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:4px;padding:1px 3px}
.card-vendor-unit-text:hover{background:#f0f0ee;color:#888}

/* 인라인 수정 팝업 - 업체/단위 */
.inline-edit-popup{position:absolute;left:0;right:0;bottom:50px;background:#fff;border:1.5px solid #e8e8e5;border-radius:12px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,0.12);z-index:35;display:none}
.inline-edit-popup.show{display:block}
.inline-edit-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.inline-edit-row:last-child{margin-bottom:0}
.inline-edit-label{font-size:12px;color:#aaa;width:34px;flex-shrink:0;font-weight:600}
.inline-edit-select{flex:1;padding:7px 10px;border:1.5px solid #e8e8e5;border-radius:7px;font-size:14px;font-family:inherit;background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.inline-save-btn{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

/* 스태퍼 */
.stepper{display:flex;align-items:center;justify-content:space-between;background:#f7f7f5;border-radius:8px;padding:3px}
.step-btn{width:32px;height:32px;border:none;border-radius:6px;font-size:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1}
.step-btn.minus{background:#fee2e2;color:#dc2626}
.step-btn.minus:active{background:#fecaca}
.step-btn.plus{background:#dcfce7;color:#16a34a}
.step-btn.plus:active{background:#bbf7d0}
.step-val{font-size:15px;font-weight:800;min-width:28px;text-align:center;color:#bbb;border:1.5px dashed #e0e0e0;border-radius:6px;padding:2px 4px;transition:all 0.15s}
.step-val.is-manual{color:#16a34a;border:1.5px solid #16a34a;background:#f0fdf4}
.step-val.is-auto{color:#3b82f6;border:1.5px solid #3b82f6;background:#eff6ff}

/* 카드 푸터 */
.card-footer{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 7px;border-top:1px solid #f5f5f3}
.order-btns{display:flex;gap:3px}
.order-btn{font-size:11px;color:#ccc;background:none;border:1px solid #e8e8e5;border-radius:4px;padding:2px 7px;cursor:pointer}
.order-btn:active{background:#f0f0ee}
.card-menu-btn{font-size:16px;color:#ccc;background:none;border:none;cursor:pointer;padding:1px 4px}
.card-menu-btn:hover{color:#888}
.card-menu-popup{position:absolute;right:6px;bottom:36px;background:#fff;border:1.5px solid #e8e8e5;border-radius:10px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:30;display:none;min-width:160px}
.card-menu-popup.show{display:block}
.card-menu-item{display:block;width:100%;padding:9px 13px;font-size:14px;font-weight:500;text-align:left;background:none;border:none;cursor:pointer;border-radius:6px;font-family:inherit;color:#1a1a1a}
.card-menu-item:hover{background:#f5f5f3}
.card-menu-item.danger{color:#dc2626}
.card-menu-item.danger:hover{background:#fee2e2}

/* 네팔어/영어 번역 */
.card-translation{font-size:10px;color:#aaa;line-height:1.4;margin-bottom:5px;min-height:14px}

/* 품목 추가 버튼 */
.add-item-row{margin-top:10px}
.add-item-btn{width:100%;padding:12px;border:1.5px dashed #d0d0ce;border-radius:11px;font-size:14px;font-weight:600;background:#fafaf8;cursor:pointer;color:#aaa;font-family:inherit}
.add-item-btn:active{background:#f0f0ee}

/* 미사용 섹션 */
.inactive-section{margin-top:18px}
.inactive-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:#f0f0ee;border-radius:9px;cursor:pointer;border:none;width:100%;font-family:inherit}
.inactive-toggle-label{font-size:13px;font-weight:600;color:#888}
.inactive-chevron{font-size:11px;color:#aaa;transition:transform 0.2s}
.inactive-chevron.open{transform:rotate(180deg)}
.inactive-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.inactive-grid.open{display:grid}

/* 모달 공통 */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:18px 18px 34px;width:100%;max-height:88vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:#e0e0e0;border-radius:2px;margin:0 auto 16px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btn{padding:10px 18px;border-radius:10px;border:1.5px solid #e8e8e5;font-size:14px;font-weight:600;background:#fff;cursor:pointer;font-family:inherit;color:#1a1a1a}
.modal-btn.danger{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.modal-btn.confirm{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.modal-btn.confirm:disabled{background:#d1d5db;border-color:#d1d5db;cursor:not-allowed}

/* 품목 추가 모달 */
.add-modal-field{margin-bottom:14px}
.add-modal-field label{display:block;font-size:12px;font-weight:700;color:#888;margin-bottom:7px;text-transform:uppercase;letter-spacing:0.04em}
.add-modal-input{width:100%;padding:12px 13px;border:1.5px solid #e8e8e5;border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none;color:#1a1a1a}
.add-modal-input:focus{border-color:#999}
.add-modal-select{width:100%;padding:12px 13px;border:1.5px solid #e8e8e5;border-radius:10px;font-size:16px;font-family:inherit;background:#fff;outline:none;color:#1a1a1a;-webkit-appearance:none}
.unit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.unit-chip{padding:9px 4px;text-align:center;border:1.5px solid #e8e8e5;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:#666}
.unit-chip.selected{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* 발주 모달 */
.order-preview-block{background:#f7f7f5;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid #e8e8e5}
.order-vendor-name{font-size:13px;font-weight:700;color:#888;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.order-vendor-suffix{font-size:12px;color:#aaa;margin-bottom:6px;padding:4px 8px;background:#fff;border-radius:6px;border:1px solid #f0f0ee}
.order-item-line{font-size:14px;padding:2px 0}
.tag-sms{font-size:10px;padding:1px 6px;border-radius:4px;background:#dcfce7;color:#16a34a;font-weight:600}
.tag-nosms{font-size:10px;padding:1px 6px;border-radius:4px;background:#f0f0ee;color:#999;font-weight:600}
.send-status{padding:10px 14px;border-radius:9px;font-size:14px;margin-top:10px}
.send-ok{background:#dcfce7;color:#16a34a}
.send-err{background:#fee2e2;color:#dc2626}

/* 설정 탭 */
.settings-block{background:#fff;border-radius:14px;border:1.5px solid #e8e8e5;padding:16px;margin-bottom:14px}
.settings-block h3{font-size:13px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px}

/* SOP 블록 */
.sop-block{background:#fffbeb;border:1.5px solid #fde68a;border-radius:14px;padding:16px;margin-bottom:14px}
.sop-block h3{font-size:14px;font-weight:700;color:#92400e;margin-bottom:10px}
.sop-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.sop-num{width:24px;height:24px;background:#f59e0b;color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sop-text{font-size:13px;color:#78350f;line-height:1.6}
.sop-text strong{color:#92400e}

/* 업체 카드 */
.vendor-card{border:1.5px solid #e8e8e5;border-radius:10px;padding:12px 14px;margin-bottom:8px;background:#fafaf8}
.vendor-card-top{display:flex;align-items:center;justify-content:space-between}
.vendor-card-info{flex:1}
.vendor-name-label{font-size:15px;font-weight:700;display:block;margin-bottom:2px}
.vendor-contact{font-size:12px;color:#aaa}
.vendor-card-actions{display:flex;align-items:center;gap:8px}
.vendor-sms-toggle{font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;border:1.5px solid #e0e0e0;cursor:pointer;background:#fff;color:#bbb}
.vendor-sms-toggle.on{background:#dcfce7;color:#16a34a;border-color:#86efac}
.vendor-edit-btn{font-size:15px;color:#ccc;background:none;border:none;cursor:pointer}
.vendor-edit-btn:hover{color:#888}
.vendor-del-btn{font-size:15px;color:#ddd;background:none;border:none;cursor:pointer}
.vendor-del-btn:hover{color:#dc2626}
.vendor-edit-form{border-top:1px solid #f0f0ee;margin-top:10px;padding-top:10px;display:none}
.vendor-edit-form.open{display:block}
.vendor-field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.vendor-field label{font-size:12px;color:#aaa;width:52px;flex-shrink:0}
.vendor-field input{flex:1;padding:8px 10px;border:1.5px solid #e8e8e5;border-radius:7px;font-size:14px;font-family:inherit;background:#fff;outline:none;color:#1a1a1a}
.vendor-field input:focus{border-color:#999}
.vendor-save-btn{width:100%;margin-top:6px;padding:9px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.vendor-suffix-field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.vendor-suffix-label{font-size:12px;color:#aaa;width:52px;flex-shrink:0}
.vendor-suffix-input{flex:1;padding:8px 10px;border:1.5px solid #e8e8e5;border-radius:7px;font-size:14px;font-family:inherit;background:#fff;outline:none;color:#1a1a1a}

.settings-add-row{display:flex;gap:8px;margin-top:10px}
.settings-input{flex:1;padding:9px 12px;border:1.5px solid #e8e8e5;border-radius:9px;font-size:14px;font-family:inherit;background:#fff;outline:none;color:#1a1a1a}
.settings-add-btn{padding:9px 16px;border-radius:9px;border:1.5px solid #e8e8e5;font-size:14px;font-weight:600;background:#fff;cursor:pointer;font-family:inherit}

/* 카테고리 이동 모달 */
.move-cat-item{padding:12px 14px;border:1.5px solid #e8e8e5;border-radius:9px;margin-bottom:7px;cursor:pointer;font-size:15px;font-weight:600;background:#fafaf8}
.move-cat-item:hover{background:#f0f0ee}
.move-cat-item.current{border-color:#1a1a1a;background:#fff}
.move-section-item{padding:10px 14px;border:1.5px solid #e8e8e5;border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:14px;font-weight:600;background:#fafaf8}
.move-section-item:hover{background:#f0f0ee}

/* 하단 버튼 */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(247,247,245,0.95);backdrop-filter:blur(10px);border-top:1px solid #e8e8e5;padding:10px 16px 22px;display:flex;gap:10px;z-index:40}
.btn-draft{flex:1;padding:13px;border:1.5px solid #e8e8e5;border-radius:12px;font-size:15px;font-weight:700;background:#fff;cursor:pointer;font-family:inherit;color:#666}
.btn-draft:active{background:#f0f0ee}
.btn-order{flex:2;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;background:#d1d5db;cursor:pointer;font-family:inherit;color:#fff;transition:background 0.15s}
.btn-order.ready{background:#1a1a1a}

@keyframes pulse-highlight{0%{box-shadow:0 0 0 0 rgba(245,158,11,0.4)}70%{box-shadow:0 0 0 8px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}
.item-card.highlighted{animation:pulse-highlight 1s ease-out}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🐟 정바다 발주</h1>
    <span class="draft-badge" id="draftBadge">임시저장 있음</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="품목 검색..." oninput="handleSearch(this.value)">
    <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
  </div>
  <div class="tab-bar" id="tabBar"></div>
</div>

<div class="content" id="mainContent"></div>

<div class="bottom-bar" id="bottomBar">
  <button class="btn-draft" onclick="saveDraft()">임시 저장</button>
  <button class="btn-order" id="orderBtn" onclick="openOrderModal()">발주 확정 →</button>
</div>

<!-- 삭제 모달 -->
<div class="modal-bg" id="deleteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>품목 삭제</h3>
    <p style="font-size:14px;color:#666;line-height:1.6" id="deleteMsg"></p>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('deleteModal')">취소</button>
      <button class="modal-btn danger" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<!-- 업체 삭제 확인 모달 -->
<div class="modal-bg" id="vendorDeleteModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>업체 삭제</h3>
    <p style="font-size:14px;color:#666;line-height:1.6" id="vendorDeleteMsg"></p>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('vendorDeleteModal')">취소</button>
      <button class="modal-btn danger" onclick="confirmVendorDelete()">삭제</button>
    </div>
  </div>
</div>

<!-- 품목 추가 모달 -->
<div class="modal-bg" id="addItemModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>품목 추가</h3>
    <div id="addModalBody"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('addItemModal')">취소</button>
      <button class="modal-btn confirm" onclick="confirmAddItem()">추가</button>
    </div>
  </div>
</div>

<!-- 발주 확정 모달 -->
<div class="modal-bg" id="orderModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>발주 확정</h3>
    <p style="font-size:13px;color:#888;margin-bottom:12px">수량이 입력된 품목으로 업체별 문자 발송</p>
    <div id="orderPreview"></div>
    <div id="sendStatus"></div>
    <div class="modal-actions">

function migrateState(p){
  if(!p.managers) p.managers=DEFAULT_DATA.managers;
  p.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.autoOrder===undefined) item.autoOrder=false;
      if(item.inactive===undefined) item.inactive=false;
      if(item.manualQty===undefined) item.manualQty=false;
      if(!item.orders) item.orders=[];
      if(!item.translations) item.translations={};
    });
  });
  p.vendors.forEach(v=>{
    if(v.contact===undefined) v.contact='';
    if(v.link===undefined) v.link='';
    if(v.vid===undefined) v.vid='';
    if(v.pw===undefined) v.pw='';
    if(v.suffix===undefined) v.suffix='';
  });
  // 포장재를 주류 앞으로
  const cats = p.categories;
  const pkgIdx = cats.findIndex(c=>c.id==='packaging');
  const alcIdx = cats.findIndex(c=>c.id==='alcohol');
  if(pkgIdx > alcIdx && pkgIdx !== -1 && alcIdx !== -1){
    const [pkg] = cats.splice(pkgIdx,1);
    cats.splice(alcIdx,0,pkg);
  }
  if(!p.categories.find(c=>c.id==='welfare')) p.categories.push(DEFAULT_DATA.categories.find(c=>c.id==='welfare'));
  return p;
}

function loadState(){
  try{
    const s=localStorage.getItem('jungbada_order_v4');
    if(s){ return migrateState(JSON.parse(s)); }
  }catch(e){}
  const d=JSON.parse(JSON.stringify(DEFAULT_DATA));
  const cats=d.categories;
  const pkgIdx=cats.findIndex(c=>c.id==='packaging');
  const alcIdx=cats.findIndex(c=>c.id==='alcohol');
  if(pkgIdx>alcIdx&&pkgIdx!==-1&&alcIdx!==-1){const[pkg]=cats.splice(pkgIdx,1);cats.splice(alcIdx,0,pkg);}
  return d;
}

// 서버에서 최신 데이터 불러와서 병합
// 마지막으로 서버에서 받은 updatedAt 저장
let lastServerTime = null;

// 서버 데이터 적용 (수량은 로컬 유지)
function applyServerData(serverData, silent){
  const qtyMap = {};
  state.categories.forEach(cat=>{
    cat.items.forEach(item=>{ if(item.qty>0) qtyMap[item.id]=item.qty; });
  });
  const openMap = {};
  state.categories.forEach(cat=>{ openMap[cat.id]=cat.open; });

  state.categories = serverData.categories.map(cat=>({
    ...cat,
    open: openMap[cat.id] !== undefined ? openMap[cat.id] : cat.open,
    items: cat.items.map(item=>({
      ...item,
      qty: qtyMap[item.id] || 0
    }))
  }));
  state.vendors = serverData.vendors || state.vendors;

  localStorage.setItem('jungbada_order_v4', JSON.stringify(state));
  renderTabs();
  renderContent();
  if(!silent) showSyncNotice('🔄 다른 기기의 변경사항이 반영됐습니다');
}

// 서버 초기 로드
async function syncFromServer(){
  try {
    const res = await fetch(GAS_URL + '?action=loadAppData');
    const json = await res.json();

    if(!json.data){
      // 서버에 데이터 없음 → 현재 로컬 데이터를 서버에 저장
      await saveToServer();
      showSyncNotice('✅ 서버 초기화 완료');
      return;
    }

    lastServerTime = json.updatedAt || null;
    applyServerData(json.data, true);
    showSyncNotice('✅ 서버에서 데이터를 불러왔습니다');
  } catch(e) {
    showSyncNotice('⚠️ 서버 연결 실패 (로컬 데이터 사용 중)');
  }
}

// 30초마다 서버 변경 감지 (폴링)
async function pollServer(){
  try {
    const res = await fetch(GAS_URL + '?action=loadAppData');
    const json = await res.json();
    if(!json.data) return;

    const serverTime = json.updatedAt || null;
    // 서버 타임스탬프가 바뀌었으면 → 다른 기기에서 변경한 것
    if(serverTime && serverTime !== lastServerTime){
      lastServerTime = serverTime;
      applyServerData(json.data, false);
    }
  } catch(e) {}
}

function showSyncNotice(msg){
  const n=document.createElement('div');
  n.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;white-space:nowrap;pointer-events:none';
  n.textContent=msg;
  document.body.appendChild(n);
  setTimeout(()=>n.remove(),2500);
}

// 서버(Apps Script)에 앱 데이터 저장
async function saveToServer(){
  try {
    const payload = { categories: state.categories, vendors: state.vendors };
    const res = await fetch(GAS_URL + '?action=saveAppData', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.success && data.updatedAt){
      // 내가 방금 저장한 시간을 lastServerTime으로 기록
      // → 폴링 시 내 변경을 다시 적용하지 않음
      lastServerTime = data.updatedAt;
    }
  } catch(e) {}
}

function today(){return new Date().toISOString().slice(0,10)}
function daysSince(d){if(!d)return null;return Math.floor((new Date(today())-new Date(d))/864e5)}

function getAvgQty(item){

function getSuggest(item, catId){
  if(catId==='seafood'){
    const ds=daysSince(item.lastOrder);
    if(ds===null) return {type:'today',label:'첫 발주'};
    if(ds>=1) return {type:'today',label:'오늘'};
    return {type:'ok',label:'D-1'};
  }
  const ds=daysSince(item.lastOrder);
  if(ds===null) return {type:'today',label:'첫 발주'};
  const rem=item.cycle-ds;
  if(rem<=0) return {type:'today',label:'오늘'};
  if(rem<=3) return {type:'soon',label:'D-'+rem};
  return {type:'ok',label:'D-'+rem};
}

function renderContent(){
  const container=document.getElementById('mainContent');
  container.innerHTML='';
  state.categories.forEach(cat=>{
    const div=document.createElement('div');
    div.className='tab-content'+(cat.id===activeCat?' active':'');
    div.id='tab_'+cat.id;
    const activeItems=cat.items.filter(i=>!i.inactive);
    const inactiveItems=cat.items.filter(i=>i.inactive);
    if(cat.id==='ingredient'){
      const zoneMap={};
      INGREDIENT_ZONES.forEach(z=>{zoneMap[z.id]=[]});
      const unzoned=[];
      activeItems.forEach(item=>{
        let placed=false;
        for(const z of INGREDIENT_ZONES){if(z.items.includes(item.id)){zoneMap[z.id].push(item);placed=true;break}}
        if(!placed) unzoned.push(item);
      });
      INGREDIENT_ZONES.forEach(zone=>{
        const zItems=zoneMap[zone.id];
        if(!zItems.length) return;
        div.appendChild(buildZoneSection(cat.id,zone.id,zone.name,zItems,true));
      });
      if(unzoned.length>0){
        div.appendChild(buildZoneSection(cat.id,'z_extra','📌 기타',unzoned,true));
      }
    } else {
      const grid=document.createElement('div');
      grid.className='card-grid';
      activeItems.forEach((item,idx)=>grid.appendChild(createItemCard(cat.id,item,idx,activeItems.length)));
      div.appendChild(grid);

      addRow.innerHTML=`<button class="add-item-btn" onclick="openAddModal('${cat.id}',null)">+ 품목 추가</button>`;

      div.appendChild(sec);

        const g=document.getElementById('inactiveGrid_'+cat.id);
        if(g) inactiveItems.forEach((item,idx)=>g.appendChild(createItemCard(cat.id,item,idx,inactiveItems.length,true)));
      },0);

  });

function buildZoneSection(catId, zoneId, zoneName, items, showAdd){
  const sec=document.createElement('div');
  sec.className='zone-section';
  sec.id='zone_'+zoneId;
  const header=document.createElement('div');
  header.className='zone-header';
  header.innerHTML=`
    <div class="zone-title-wrap">
      <span class="zone-title" id="zoneTitle_${zoneId}" onclick="startEditZone('${zoneId}','${zoneName}')">${zoneName}</span>
      <input class="zone-title-input" id="zoneTitleInput_${zoneId}" value="${zoneName}" onblur="cancelEditZone('${zoneId}')" onkeydown="if(event.key==='Enter')saveZoneName('${catId}','${zoneId}')">
      <button class="zone-save-btn" id="zoneSaveBtn_${zoneId}" onclick="saveZoneName('${catId}','${zoneId}')">저장</button>
    </div>
    <span class="zone-count">${items.length}개</span>`;
  sec.appendChild(header);
  const grid=document.createElement('div');
  grid.className='card-grid';
  grid.id='grid_'+zoneId;
  items.forEach((item,idx)=>grid.appendChild(createItemCard(catId,item,idx,items.length)));
  sec.appendChild(grid);
  if(showAdd){
    const addRow=document.createElement('div');
    addRow.className='add-item-row';
    addRow.style.marginTop='8px';
    addRow.innerHTML=`<button class="add-item-btn" onclick="openAddModal('${catId}','${zoneId}')">+ ${zoneName} 품목 추가</button>`;
    sec.appendChild(addRow);
  }
  return sec;
}

function createItemCard(catId, item, idx, total, isInactive=false){
  const card=document.createElement('div');
  card.className='item-card'+(isInactive?' inactive':'');
  card.id='card_'+item.id;
  const s=getSuggest(item,catId);
  const ddayClass={today:'dday-today',soon:'dday-soon',ok:'dday-ok'}[s.type]||'dday-first';
  const displayQty=item.qty;
  let valClass='step-val';
  if(displayQty>0) valClass=item.autoOrder?'step-val is-auto':'step-val is-manual';
  const tr=item.translations||{};
  const trText=tr.en||tr.ne?`${tr.en||''}${tr.en&&tr.ne?' / ':''}${tr.ne||''}`:'';

  card.innerHTML=`
    <div class="dday-badge ${ddayClass}">${s.label}</div>
    ${item.autoOrder?'<div class="auto-badge show">자동</div>':'<div class="auto-badge"></div>'}

      </div>
      ${!isInactive?`
      <div class="stepper">
        <button class="step-btn minus" onclick="stepQty('${catId}','${item.id}',-1)">−</button>
        <span class="${valClass}" id="val_${item.id}">${displayQty}</span>
        <button class="step-btn plus" onclick="stepQty('${catId}','${item.id}',1)">+</button>

        ${!isInactive&&idx>0?`<button class="order-btn" onclick="moveItem('${catId}','${item.id}',-1)">▲</button>`:'<span style="width:32px"></span>'}

        ?`<button class="card-menu-item" onclick="toggleInactive('${catId}','${item.id}',false);closeAllMenus()">✅ 활성화</button>`
        :`<button class="card-menu-item" onclick="toggleAutoOrder('${catId}','${item.id}');closeAllMenus()">${item.autoOrder?'🔵 자동발주 OFF':'⚪ 자동발주 ON'}</button>
          <button class="card-menu-item" onclick="openMoveCat('${catId}','${item.id}');closeAllMenus()">📂 카테고리 이동</button>
          ${catId==='ingredient'?`<button class="card-menu-item" onclick="openMoveSection('${catId}','${item.id}');closeAllMenus()">📌 섹션 이동</button>`:''}
          <button class="card-menu-item" onclick="translateItem('${catId}','${item.id}');closeAllMenus()">🌐 번역 (영어/네팔어)</button>
          <button class="card-menu-item" onclick="toggleInactive('${catId}','${item.id}',true);closeAllMenus()">🚫 미사용으로</button>`}
      <button class="card-menu-item danger" onclick="askDelete('${catId}','${item.id}');closeAllMenus()">🗑 삭제</button>
    </div>
    <div class="inline-edit-popup" id="inlineEdit_${item.id}">
      <div class="inline-edit-row">
        <span class="inline-edit-label">업체</span>
        <select class="inline-edit-select" id="vendorSel_${item.id}">
          ${state.vendors.map(v=>`<option${v.name===item.vendor?' selected':''}>${v.name}</option>`).join('')}
        </select>
      </div>
      <div class="inline-edit-row">
        <span class="inline-edit-label">단위</span>
        <select class="inline-edit-select" id="unitSel_${item.id}">
          ${UNITS.map(u=>`<option${u===item.unit?' selected':''}>${u}</option>`).join('')}
        </select>
      </div>
      <button class="inline-save-btn" onclick="saveInlineEdit('${catId}','${item.id}')">저장</button>
    </div>`;
  return card;
}

function getCatEmoji(catId){return({seafood:'🐟',ingredient:'🥬',alcohol:'🍺',packaging:'📦',etc:'🧹',welfare:'🎁'})[catId]||'📦'}

// ── 이미지 ──
async function renderAllImages(){
  const cats=activeCat==='settings'?[]:[state.categories.find(c=>c.id===activeCat)].filter(Boolean);
  for(const cat of cats){
    for(const item of cat.items){
      // 1순위: 로컬 IndexedDB 캐시
      const localImg=await loadImg('img_'+item.id);
      if(localImg){ setCardImage(item.id,localImg); continue; }
      // 2순위: 서버 시트에서 불러오기
      if(item.imageUrl && item.imageUrl.startsWith('__sheet__')){
        loadImageFromServer(item.id);
      }
    }
  }
}

async function loadImageFromServer(itemId){
  try {
    const res=await fetch(GAS_URL+'?action=loadImage&itemId='+encodeURIComponent(itemId));
    const data=await res.json();
    if(data.data){
      await saveImg('img_'+itemId, data.data); // 로컬에 캐시
      setCardImage(itemId, data.data);
    }
  } catch(e){}
}
function setCardImage(itemId,data){
  const wrap=document.getElementById('cardImg_'+itemId);
  if(!wrap) return;
  wrap.innerHTML=`<img src="${data}" alt="" style="width:100%;height:100%;object-fit:cover">`;
}
function triggerImgUpload(itemId){document.getElementById('imgInput_'+itemId)?.click()}
async function handleImgUpload(itemId,input){
  const file=input.files[0];
  if(!file) return;

  // 로컬에도 미리 표시 (빠른 UX)
  const reader=new FileReader();
  reader.onload=async e=>{
    const base64=e.target.result;
    await saveImg('img_'+itemId,base64);
    setCardImage(itemId,base64);

    // 드라이브에 업로드 (백그라운드)
    try {
      showSyncNotice('📷 사진 서버에 업로드 중...');
      const res=await fetch(GAS_URL+'?action=uploadImage',{
        method:'POST',
        body:JSON.stringify({itemId, imageBase64:base64, mimeType:file.type})
      });
      const data=await res.json();
      if(data.success){
        // 시트 저장 완료 → imageUrl 마커 저장
        state.categories.forEach(cat=>{
          const item=cat.items.find(i=>i.id===itemId);
          if(item){ item.imageUrl='__sheet__'+itemId; }
        });
        // 즉시 서버에 저장
        localStorage.setItem('jungbada_order_v4', JSON.stringify(state));
        localStorage.setItem('jungbada_order_v4_time', new Date().toISOString());
        await saveToServer();
        showSyncNotice('✅ 사진 업로드 완료 - 다른 기기에서도 볼 수 있어요');
      }
    } catch(err){ showSyncNotice('⚠️ 사진 서버 업로드 실패 (로컬에는 저장됨)'); }
  };
  reader.readAsDataURL(file);
}

// ── 번역 (Claude API) ──
async function translateItem(catId, itemId){
  const item=state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  if(!item) return;
  document.getElementById('translateModal').classList.add('show');
  document.getElementById('translateStatus').textContent=`"${item.name}" 번역 중...`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:200,
        messages:[{role:'user',content:`식당 식자재 품목명 "${item.name}"을 영어와 네팔어로 번역해줘. JSON만 반환해: {"en":"영어번역","ne":"नेपाली번역"}`}]
      })
    });
    const data=await res.json();
    const text=data.content[0].text;
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);
    item.translations=parsed;
    save();
    const trEl=document.getElementById('tr_'+itemId);
    if(trEl){
      const trText=[parsed.en,parsed.ne].filter(Boolean).join(' / ');
      trEl.textContent=trText;
    }
  }catch(e){
    alert('번역 실패: '+e.message);
  }
  document.getElementById('translateModal').classList.remove('show');
}

function openMoveCat(catId, itemId){
  pendingMoveCat={catId,itemId};
  const item=state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  document.getElementById('moveCatItemName').textContent=`"${item?.name}" 이동할 카테고리 선택`;
  const list=document.getElementById('moveCatList');
  list.innerHTML=state.categories.filter(c=>c.id!==catId).map(c=>`
    <div class="move-cat-item" onclick="confirmMoveCat('${c.id}')">${c.emoji} ${c.name}</div>`).join('');
  document.getElementById('moveCatModal').classList.add('show');
}
function confirmMoveCat(toCatId){
  const {catId,itemId}=pendingMoveCat;
  const fromCat=state.categories.find(c=>c.id===catId);
  const toCat=state.categories.find(c=>c.id===toCatId);
  if(!fromCat||!toCat) return;
  const idx=fromCat.items.findIndex(i=>i.id===itemId);
  if(idx===-1) return;
  const [item]=fromCat.items.splice(idx,1);
  toCat.items.push(item);
  saveNow();
  closeModal('moveCatModal');
  rerenderCurrentTab(catId);
}

// ── 섹션 이동 (식자재) ──
function openMoveSection(catId, itemId){
  pendingMoveSection={catId,itemId};
  const item=state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  document.getElementById('moveSectionItemName').textContent=`"${item?.name}" 이동할 섹션 선택`;
  const list=document.getElementById('moveSectionList');
  list.innerHTML=INGREDIENT_ZONES.map(z=>`
    <div class="move-section-item" onclick="confirmMoveSection('${z.id}')">${z.name}</div>`).join('');
  document.getElementById('moveSectionModal').classList.add('show');
}
function confirmMoveSection(zoneId){
  const {itemId}=pendingMoveSection;
  // 기존 zone에서 제거
  INGREDIENT_ZONES.forEach(z=>{
    const idx=z.items.indexOf(itemId);
    if(idx!==-1) z.items.splice(idx,1);
  });
  // 새 zone에 추가
  const zone=INGREDIENT_ZONES.find(z=>z.id===zoneId);
  if(zone) zone.items.push(itemId);
  saveNow();
  closeModal('moveSectionModal');
  rerenderCurrentTab('ingredient');
}

function switchTab(catId){
  activeCat=catId;
  renderTabs();
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  const t=document.getElementById('tab_'+catId);
  if(t){t.classList.add('active');renderAllImages()}
  document.getElementById('bottomBar').style.display=catId==='settings'?'none':'flex';
}

function stepQty(catId, itemId, delta){
  const item=state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  if(!item) return;
  item.qty=Math.max(0,(item.qty||0)+delta);
  item.manualQty=item.qty>0;
  save();
  const el=document.getElementById('val_'+itemId);
  if(el){
    el.textContent=item.qty;
    el.className=item.qty>0?(item.autoOrder?'step-val is-auto':'step-val is-manual'):'step-val';
  }
  updateOrderBtn();
}

function moveItem(catId, itemId, dir){
  const cat=state.categories.find(c=>c.id===catId);
  const idx=cat.items.findIndex(i=>i.id===itemId);
  const ni=idx+dir;
  if(ni<0||ni>=cat.items.length) return;
  [cat.items[idx],cat.items[ni]]=[cat.items[ni],cat.items[idx]];
  saveNow();rerenderCurrentTab(catId);
}

function toggleAutoOrder(catId, itemId){
  const item=state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  if(!item) return;
  item.autoOrder=!item.autoOrder;
  save();rerenderCurrentTab(catId);
}

function toggleInactive(catId, itemId, inactive){
  const item=state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  if(item){item.inactive=inactive;save();rerenderCurrentTab(catId)}
}

function toggleInactiveSection(catId){
  const cat=state.categories.find(c=>c.id===catId);
  if(!cat) return;
  cat.inactiveOpen=!cat.inactiveOpen;save();
  document.getElementById('inactiveGrid_'+catId)?.classList.toggle('open',cat.inactiveOpen);
  document.getElementById('inactiveChevron_'+catId)?.classList.toggle('open',cat.inactiveOpen);

      <div class="sop-step"><div class="sop-num">6</div><div class="sop-text">수신된 문자를 각 업체 <strong>카톡방에 복붙</strong></div></div>
      <div class="sop-step"><div class="sop-num">7</div><div class="sop-text">품목 추가/수정: 카드 클릭(이름), 업체·단위 텍스트 클릭(드롭다운)</div></div>
      <div class="sop-step"><div class="sop-num">8</div><div class="sop-text">품목 이동/삭제: 카드 우하단 <strong>···</strong> 버튼</div></div>
      <div class="sop-step"><div class="sop-num">9</div><div class="sop-text">업체 관리/마지막문구 설정: 이 설정 탭</div></div>
    </div>
    <div class="settings-block">
      <h3>업체 관리</h3>
      ${vendorCards}
      <div class="settings-add-row">
        <input class="settings-input" id="newVendorInput" placeholder="새 업체명" onkeydown="if(event.key==='Enter')addVendor()">
        <button class="settings-add-btn" onclick="addVendor()">+ 추가</button>
      </div>
    </div>`;
}

function toggleVendorForm(idx){document.getElementById('vendorForm_'+idx)?.classList.toggle('open')}
function saveVendor(idx){
  state.vendors[idx].name=document.getElementById('vName_'+idx)?.value.trim()||state.vendors[idx].name;
  state.vendors[idx].contact=document.getElementById('vContact_'+idx)?.value||'';
  state.vendors[idx].link=document.getElementById('vLink_'+idx)?.value||'';
  state.vendors[idx].vid=document.getElementById('vVid_'+idx)?.value||'';
  state.vendors[idx].pw=document.getElementById('vPw_'+idx)?.value||'';
  state.vendors[idx].suffix=document.getElementById('vSuffix_'+idx)?.value||'';
  save();
  document.getElementById('tab_settings').innerHTML=renderSettingsHTML();
  saveNow();
}
function askVendorDelete(idx){
  pendingVendorDel=idx;
  document.getElementById('vendorDeleteMsg').textContent=`"${state.vendors[idx].name}" 업체를 삭제하시겠습니까?`;
  document.getElementById('vendorDeleteModal').classList.add('show');
}
function confirmVendorDelete(){
  if(pendingVendorDel!==null){state.vendors.splice(pendingVendorDel,1);save()}
  closeModal('vendorDeleteModal');
  document.getElementById('tab_settings').innerHTML=renderSettingsHTML();
}
function askSmsToggle(idx){
  pendingSmsToggle.idx=idx;
  const v=state.vendors[idx];
  document.getElementById('smsConfirmMsg').textContent=`"${v.name}" 업체의 문자 발송을 ${v.sms?'OFF':'ON'} 으로 변경하시겠습니까?`;
  document.getElementById('smsConfirmModal').classList.add('show');
}
function confirmSmsToggle(){
  const idx=pendingSmsToggle.idx;
  if(idx!==null){state.vendors[idx].sms=!state.vendors[idx].sms;save()}
  closeModal('smsConfirmModal');
  document.getElementById('tab_settings').innerHTML=renderSettingsHTML();
}
function addVendor(){
  const input=document.getElementById('newVendorInput');
  if(!input?.value.trim()) return;
  state.vendors.push({name:input.value.trim(),sms:true,contact:'',link:'',vid:'',pw:'',suffix:''});
  input.value='';save();
  document.getElementById('tab_settings').innerHTML=renderSettingsHTML();
}

function updateOrderBtn(){
  let cnt=0;
  state.categories.forEach(cat=>cat.items.forEach(item=>{if(item.qty>0)cnt++}));
  const btn=document.getElementById('orderBtn');
  btn.textContent=cnt>0?`발주 확정 (${cnt}개) →`:'발주 확정 →';
  btn.className='btn-order'+(cnt>0?' ready':'');
}

// ── 검색 ──
function handleSearch(query){
  document.getElementById('searchClear').style.display=query?'block':'none';
  if(!query.trim()){document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('highlighted'));return}
  const q=query.toLowerCase();
  let first=null;
  state.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      const card=document.getElementById('card_'+item.id);
      if(!card) return;
      const match=item.name.toLowerCase().includes(q)||item.vendor.toLowerCase().includes(q);
      card.classList.toggle('highlighted',match);
      if(match&&!first) first={catId:cat.id,itemId:item.id};
    });
  });
  if(first&&activeCat!==first.catId){
    switchTab(first.catId);renderTabs();
    setTimeout(()=>document.getElementById('card_'+first.itemId)?.scrollIntoView({behavior:'smooth',block:'center'}),150);
  }else if(first){
    document.getElementById('card_'+first.itemId)?.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').style.display='none';
  document.querySelectorAll('.item-card').forEach(c=>c.classList.remove('highlighted'));
}

// ── 발주 모달 ──
function openOrderModal(){
  const groups={};
  state.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.qty<=0) return;
      if(!groups[item.vendor]) groups[item.vendor]=[];
      groups[item.vendor].push(item);
    });
  });
  if(!Object.keys(groups).length){alert('수량이 입력된 품목이 없습니다.');return}
  const preview=Object.keys(groups).map(vendor=>{
    const v=state.vendors.find(v=>v.name===vendor);
    const tag=v?.sms?'<span class="tag-sms">문자 발송</span>':'<span class="tag-nosms">문자 제외</span>';
    const suffix=v?.suffix?`<div class="order-vendor-suffix">마지막 문구: ${v.suffix}</div>`:'';
    const items=groups[vendor].map(i=>`<div class="order-item-line">${i.name} ${i.qty}${i.unit}</div>`).join('');
    return `<div class="order-preview-block"><div class="order-vendor-name">${vendor} ${tag}</div>${suffix}${items}</div>`;
  }).join('');
  document.getElementById('orderPreview').innerHTML=preview;
  document.getElementById('sendStatus').innerHTML='';
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('sendBtn').textContent='문자 발송';
  document.getElementById('orderModal').classList.add('show');
}

async function sendOrder(){
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='발송 중...';
  const groups={};
  state.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.qty<=0) return;
      const v=state.vendors.find(v=>v.name===item.vendor);
      if(!v?.sms) return;
      if(!groups[item.vendor]) groups[item.vendor]={items:[],suffix:v.suffix||''};
      groups[item.vendor].items.push({name:item.name,qty:item.qty,unit:item.unit});
    });
  });
  const orders=Object.keys(groups).map(vendor=>({vendor,...groups[vendor]}));
  try{
    const res=await fetch(GAS_URL+'?action=sendOrder',{method:'POST',body:JSON.stringify(orders)});
    const data=await res.json();
    if(!data.success) throw new Error(JSON.stringify(data));
  }catch(e){
    document.getElementById('sendStatus').innerHTML=`<div class="send-status send-err">발송 실패: ${e.message}</div>`;
    btn.disabled=false;btn.textContent='다시 시도';return;
  }
  const t=today();
  state.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.qty>0){
        item.lastOrder=t;
        if(!item.orders) item.orders=[];
        item.orders.push(t);
        if(item.orders.length>20) item.orders=item.orders.slice(-20);
        item.qty=0;item.manualQty=false;
      }
    });
  });
  save();
  document.getElementById('sendStatus').innerHTML='<div class="send-status send-ok">✅ 발주 완료! 수량 초기화됨</div>';
  btn.textContent='완료';
  setTimeout(()=>{closeModal('orderModal');renderContent()},1500);
}

function closeModal(id){document.getElementById(id).classList.remove('show')}

function rerenderCurrentTab(catId){
  const wasActive=activeCat===catId;
  const container=document.getElementById('mainContent');
  const old=container.querySelector('#tab_'+catId);
  if(old) old.remove();
  const cat=state.categories.find(c=>c.id===catId);
  if(!cat) return;
  const div=document.createElement('div');
  div.className='tab-content'+(wasActive?' active':'');
  div.id='tab_'+catId;
  const activeItems=cat.items.filter(i=>!i.inactive);
  const inactiveItems=cat.items.filter(i=>i.inactive);
  if(catId==='ingredient'){
    const zoneMap={};INGREDIENT_ZONES.forEach(z=>{zoneMap[z.id]=[]});const unzoned=[];
    activeItems.forEach(item=>{let placed=false;for(const z of INGREDIENT_ZONES){if(z.items.includes(item.id)){zoneMap[z.id].push(item);placed=true;break}}if(!placed)unzoned.push(item)});
    INGREDIENT_ZONES.forEach(zone=>{const zi=zoneMap[zone.id];if(!zi.length)return;div.appendChild(buildZoneSection(catId,zone.id,zone.name,zi,true))});
    if(unzoned.length>0) div.appendChild(buildZoneSection(catId,'z_extra','📌 기타',unzoned,true));
  }else{
    const grid=document.createElement('div');grid.className='card-grid';
    activeItems.forEach((item,idx)=>grid.appendChild(createItemCard(catId,item,idx,activeItems.length)));
    div.appendChild(grid);
    const addRow=document.createElement('div');addRow.className='add-item-row';
    addRow.innerHTML=`<button class="add-item-btn" onclick="openAddModal('${catId}',null)">+ 품목 추가</button>`;
    div.appendChild(addRow);
  }
  if(inactiveItems.length>0){
    const sec=document.createElement('div');sec.className='inactive-section';const isOpen=cat.inactiveOpen||false;
    sec.innerHTML=`<button class="inactive-toggle" onclick="toggleInactiveSection('${catId}')"><span class="inactive-toggle-label">🚫 미사용 ${inactiveItems.length}개</span><span class="inactive-chevron ${isOpen?'open':''}" id="inactiveChevron_${catId}">▼</span></button><div class="inactive-grid ${isOpen?'open':''}" id="inactiveGrid_${catId}"></div>`;
    div.appendChild(sec);
    setTimeout(()=>{const g=document.getElementById('inactiveGrid_'+catId);if(g)inactiveItems.forEach((item,idx)=>g.appendChild(createItemCard(catId,item,idx,inactiveItems.length,true)))},0);
  }
  container.appendChild(div);
  if(wasActive) renderAllImages();
  updateOrderBtn();
}

// ── 초기화 ──
openImgDB();
renderTabs();
renderContent();
const hasQty=state.categories.some(c=>c.items.some(i=>i.qty>0));
if(hasQty) document.getElementById('draftBadge').classList.add('show');
// 서버에서 최신 데이터 동기화
syncFromServer();
// 30초마다 서버 변경 감지
setInterval(pollServer, 30000);
</script>
