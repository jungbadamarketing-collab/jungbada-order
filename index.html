<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정바다 발주 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
.app{max-width:720px;margin:0 auto;padding:1rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 0 1rem;border-bottom:1px solid #e0e0dd;margin-bottom:1rem}
.top-bar h1{font-size:18px;font-weight:600;color:#1a1a1a}
.date-badge{font-size:12px;color:#888;background:#fff;padding:4px 10px;border-radius:8px;border:1px solid #e0e0dd}
.tab-bar{display:flex;gap:4px;margin-bottom:1rem;border-bottom:1px solid #e0e0dd}
.tab{font-size:13px;padding:7px 16px;cursor:pointer;border-bottom:2px solid transparent;color:#888;margin-bottom:-1px;font-weight:500}
.tab.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a}
.tab-content{display:none}.tab-content.active{display:block}
.summary-bar{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.s-card{flex:1;min-width:80px;padding:10px 12px;background:#fff;border-radius:10px;border:1px solid #e0e0dd}
.s-card .sl{font-size:11px;color:#888;margin-bottom:3px}
.s-card .sv{font-size:22px;font-weight:600}
.category-block{margin-bottom:8px;border:1px solid #e0e0dd;border-radius:12px;overflow:hidden;background:#fff}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none}
.cat-header:hover{background:#fafaf8}
.cat-left{display:flex;align-items:center;gap:8px}
.badge-daily{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;background:#e8f5ee;color:#2d7a4a}
.badge-select{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;background:#f0f0ee;color:#666}
.cat-title{font-size:15px;font-weight:600}
.cat-right{display:flex;align-items:center;gap:8px}
.order-count{font-size:12px;color:#888}
.chevron{font-size:12px;color:#aaa;transition:transform 0.2s;display:inline-block}
.chevron.open{transform:rotate(180deg)}
.cat-body{display:none;border-top:1px solid #e0e0dd}
.cat-body.open{display:block}
.cat-body-inner{padding:0 14px 14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px}
.sort-btn{font-size:11px;padding:4px 10px;border:1px solid #e0e0dd;border-radius:7px;cursor:pointer;background:#f5f5f3;color:#666}
.sort-btn.active{background:#fff3e0;color:#e65100;border-color:#ffcc80}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:#aaa;font-weight:500;padding:4px 6px;text-align:left;border-bottom:1px solid #f0f0ee;white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid #f0f0ee;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
select{font-size:12px;border:1px solid #e0e0dd;border-radius:7px;padding:3px 5px;background:#fff;color:#1a1a1a;outline:none}
select:focus{border-color:#999}
.vendor-sel{width:100%;min-width:80px}
.unit-sel{width:58px}
.stepper{display:flex;align-items:center;gap:4px}
.step-btn{width:26px;height:26px;border:1px solid #e0e0dd;border-radius:7px;cursor:pointer;background:#fff;color:#1a1a1a;font-size:16px;display:flex;align-items:center;justify-content:center;user-select:none;line-height:1}
.step-btn:hover{background:#f0f0ee}
.step-btn:active{background:#e5e5e2;transform:scale(0.95)}
.step-val{width:26px;text-align:center;font-size:14px;font-weight:600;color:#aaa}
.step-val.has-qty{color:#2d7a4a}
.suggest-chip{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;white-space:nowrap;display:inline-block}
.s-today{background:#fdecea;color:#c0392b}
.s-soon{background:#fff8e1;color:#b7791f}
.s-ok{background:#e8f5ee;color:#2d7a4a}
.s-manual{font-size:11px;color:#bbb}
.del-btn{cursor:pointer;color:#ccc;padding:3px 5px;font-size:14px;line-height:1}
.del-btn:hover{color:#e74c3c}
.drag-handle{cursor:grab;color:#ccc;font-size:13px;margin-right:2px}
.drag-handle:active{cursor:grabbing}
.add-row{display:flex;align-items:center;gap:6px;padding-top:10px;margin-top:4px;border-top:1px solid #f0f0ee}
.add-input{flex:1;font-size:13px;border:1px solid #e0e0dd;border-radius:8px;padding:7px 10px;background:#fff;color:#1a1a1a;outline:none}
.add-input:focus{border-color:#999}
.add-btn{font-size:12px;padding:7px 14px;border:1px solid #e0e0dd;border-radius:8px;cursor:pointer;background:#fff;color:#1a1a1a;white-space:nowrap;font-weight:500}
.add-btn:hover{background:#f0f0ee}
.final-bar{position:sticky;bottom:0;background:rgba(245,245,243,0.95);backdrop-filter:blur(8px);border-top:1px solid #e0e0dd;padding:12px 0 4px;margin-top:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:12px}
.final-info{font-size:12px;color:#888}
.final-info span{color:#1a1a1a;font-weight:600}
.final-btn{font-size:14px;font-weight:600;padding:11px 28px;border:1px solid #e0e0dd;border-radius:10px;cursor:pointer;background:#fff;color:#999;transition:all 0.15s}
.final-btn.ready{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.final-btn.ready:hover{background:#333}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:380px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.modal-actions button{font-size:13px;padding:8px 16px;border:1px solid #e0e0dd;border-radius:8px;cursor:pointer;background:#fff;color:#1a1a1a;font-weight:500}
.modal-actions button:hover{background:#f0f0ee}
.modal-actions .danger{background:#fdecea;color:#c0392b;border-color:#f5b7b1}
.modal-actions .confirm{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.modal-actions .confirm:hover{background:#333}
.modal-actions .confirm:disabled{background:#ccc;border-color:#ccc;cursor:not-allowed}
.order-preview{background:#fafaf8;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid #e0e0dd}
.order-preview .vname{font-size:12px;font-weight:600;color:#888;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.order-preview .vitem{font-size:13px;padding:2px 0;color:#1a1a1a}
.sms-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:#e8f5ee;color:#2d7a4a;font-weight:600}
.nosms-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:#f0f0ee;color:#999;font-weight:600}
.send-status{font-size:13px;padding:8px 12px;border-radius:8px;margin-top:8px}
.send-status.ok{background:#e8f5ee;color:#2d7a4a}
.send-status.err{background:#fdecea;color:#c0392b}
.setting-block{margin-bottom:1.5rem;background:#fff;border-radius:12px;border:1px solid #e0e0dd;padding:1rem 1.25rem}
.setting-block h3{font-size:13px;font-weight:600;color:#888;margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.03em}
.apps-input{width:100%;font-size:13px;border:1px solid #e0e0dd;border-radius:8px;padding:8px 10px;background:#fafaf8;color:#1a1a1a;outline:none;margin-bottom:6px}
.apps-input:focus{border-color:#999;background:#fff}
.hint{font-size:11px;color:#aaa;line-height:1.5}
.vendor-list{display:flex;flex-direction:column;gap:6px}
.vendor-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #e0e0dd;border-radius:9px;background:#fafaf8}
.vendor-name{flex:1;font-size:13px;font-weight:500}
.sms-toggle{font-size:11px;padding:3px 10px;border:1px solid #e0e0dd;border-radius:6px;cursor:pointer;background:#fff;color:#aaa;font-weight:600}
.sms-toggle.on{background:#e8f5ee;color:#2d7a4a;border-color:#a8d5b5}
.save-notice{font-size:11px;color:#2d7a4a;margin-top:6px;display:none}
@media(max-width:480px){
  .summary-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .s-card{min-width:0}
  th:nth-child(3){display:none}td:nth-child(3){display:none}
}
</style>
</head>

<div class="app">
  <div class="top-bar">
    <h1>🐟 정바다 발주</h1>
    <span class="date-badge" id="todayDate"></span>
  </div>

  <div class="tab-bar">
    <div class="tab active" onclick="switchTab('order')">발주 체크</div>
    <div class="tab" onclick="switchTab('settings')">설정</div>
  </div>

  <!-- 발주 탭 -->
  <div id="tab-order" class="tab-content active">
    <div class="summary-bar">
      <div class="s-card"><div class="sl">오늘 발주 예정</div><div class="sv" id="sumToday">0</div></div>
      <div class="s-card"><div class="sl">이번 주 내</div><div class="sv" id="sumSoon">0</div></div>
      <div class="s-card"><div class="sl">입력된 수량</div><div class="sv" id="sumQty">0</div></div>
      <div class="s-card"><div class="sl">총 품목</div><div class="sv" id="sumTotal">0</div></div>
    </div>
    <div id="categoriesContainer"></div>
    <div class="final-bar">
      <div class="final-info">수량 입력 <span id="finalCount">0</span>개 품목</div>
      <button class="final-btn" id="finalBtn" onclick="openOrderModal()">최종 발주 →</button>
    </div>
  </div>

  <!-- 설정 탭 -->
  <div id="tab-settings" class="tab-content">
    <div class="setting-block">
      <h3>업체 관리</h3>
      <div class="vendor-list" id="vendorList"></div>
      <div class="add-row" style="border-top:none;padding-top:10px;margin-top:6px">
        <input class="add-input" id="newVendorInput" placeholder="새 업체명 입력" onkeydown="if(event.key==='Enter')addVendor()">
        <button class="add-btn" onclick="addVendor()">+ 추가</button>
      </div>
      <div class="save-notice" id="saveNotice">✓ 저장됨</div>
    </div>
  </div>
</div>

<!-- 삭제 모달 -->
<div class="modal-bg" id="deleteModal">
  <div class="modal">
    <h3>품목 삭제</h3>
    <p style="font-size:13px;color:#666;line-height:1.6" id="deleteMsg"></p>
    <div class="modal-actions">
      <button onclick="closeModal('deleteModal')">취소</button>
      <button class="danger" onclick="confirmDelete()">삭제</button>
    </div>
  </div>
</div>

<!-- 발주 확인 모달 -->
<div class="modal-bg" id="orderModal">
  <div class="modal">
    <h3>최종 발주 확인</h3>
    <p style="font-size:12px;color:#888;margin-bottom:12px">아래 내용으로 업체별 문자가 발송됩니다</p>
    <div id="orderPreview"></div>
    <div id="sendStatus"></div>
    <div class="modal-actions">
      <button onclick="closeModal('orderModal')">취소</button>
      <button class="confirm" id="sendBtn" onclick="sendOrder()">문자 발송</button>
    </div>
  </div>
</div>

function today() { return new Date().toISOString().slice(0,10); }
function daysSince(d) { if(!d) return null; return Math.floor((new Date(today()) - new Date(d)) / 864e5); }

function effectiveCycle(item) {
  if(!item.orders || item.orders.length < 3) return item.cycle;
  const s = [...item.orders].sort();
  const iv = [];
  for(let i=1;i<s.length;i++) iv.push(Math.floor((new Date(s[i])-new Date(s[i-1]))/864e5));
  const avg = iv.reduce((a,b)=>a+b,0)/iv.length;
  const w = Math.min(0.7, item.orders.length * 0.1);
  return Math.round(Math.max(item.cycle*0.5, Math.min(item.cycle*1.5, item.cycle*(1-w)+avg*w)));
}

function getSuggest(item, catId) {
  if(catId === 'seafood') return {type:'manual', label:'매일 확인'};
  const ec = effectiveCycle(item), ds = daysSince(item.lastOrder);
  if(ds === null) return {type:'today', label:'첫 발주'};
  const rem = ec - ds;
  if(rem <= 0) return {type:'today', label:'오늘'};
  if(rem <= 3) return {type:'soon', label:'D-'+rem};
  return {type:'ok', label:'D-'+rem};
}

function renderCategories() {
  const container = document.getElementById('categoriesContainer');
  if(!container) return;
  container.innerHTML = state.categories.map(cat => {
    const isSorting = sortingCatId === cat.id;
    const qtyCount = cat.items.filter(i => i.qty > 0).length;
    const rows = cat.items.map((item, idx) => {
      const s = getSuggest(item, cat.id);
      const sChip = s.type==='manual'
        ? `<span class="s-manual">${s.label}</span>`
        : `<span class="suggest-chip s-${s.type}">${s.label}</span>`;
      const unitOpts = UNITS.map(u=>`<option${u===item.unit?' selected':''}>${u}</option>`).join('');
      const vendorOpts = state.vendors.map(v=>`<option${v.name===item.vendor?' selected':''}>${v.name}</option>`).join('');
      return `<tr draggable="${isSorting}"
        ondragstart="dragStart(event,'${cat.id}',${idx})"
        ondragover="dragOver(event)"
        ondrop="dragDrop(event,'${cat.id}',${idx})">
        <td>
          <div style="display:flex;align-items:center;gap:3px">
            ${isSorting?`<span class="drag-handle">⠿</span>`:''}
            ${item.name}
          </div>
        </td>
        <td><select class="vendor-sel" onchange="changeField('${cat.id}','${item.id}','vendor',this.value)">${vendorOpts}</select></td>
        <td>${sChip}</td>
        <td><select class="unit-sel" onchange="changeField('${cat.id}','${item.id}','unit',this.value)">${unitOpts}</select></td>
        <td>
          <div class="stepper">
            <button class="step-btn" onclick="stepQty('${cat.id}','${item.id}',-1)">−</button>
            <span class="step-val${item.qty>0?' has-qty':''}">${item.qty}</span>
            <button class="step-btn" onclick="stepQty('${cat.id}','${item.id}',1)">+</button>
          </div>
        </td>
        <td><span class="del-btn" onclick="askDelete('${cat.id}','${item.id}')">🗑</span></td>
      </tr>`;
    }).join('');

    return `<div class="category-block" id="cat_${cat.id}">
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <div class="cat-left">
          <span class="${cat.type==='daily'?'badge-daily':'badge-select'}">${cat.type==='daily'?'데일리':'선택'}</span>
          <span class="cat-title">${cat.name}</span>
        </div>
        <div class="cat-right">
          <span class="order-count">${qtyCount}/${cat.items.length}</span>
          <span class="chevron ${cat.open?'open':''}">▼</span>
        </div>
      </div>
      <div class="cat-body ${cat.open?'open':''}">
        <div class="cat-body-inner">
          <div class="toolbar">
            <button class="sort-btn ${isSorting?'active':''}" onclick="toggleSort(event,'${cat.id}')">${isSorting?'✓ 순서 저장':'↕ 순서 변경'}</button>
          </div>
          <table>
            <thead><tr>
              <th style="width:22%">품목</th>
              <th style="width:22%">업체</th>
              <th style="width:14%">발주 제안</th>
              <th style="width:13%">단위</th>
              <th style="width:20%">수량</th>
              <th style="width:9%"></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="add-row">
            <input class="add-input" id="addInput_${cat.id}" placeholder="새 품목명 입력" onkeydown="if(event.key==='Enter')addItem('${cat.id}')">
            <button class="add-btn" onclick="addItem('${cat.id}')">+ 추가</button>
          </div>

function renderVendorSettings() {
  const list = document.getElementById('vendorList');
  if(!list) return;

    <div class="vendor-row">
      <span class="vendor-name">${v.name}</span>
      <button class="sms-toggle ${v.sms?'on':''}" onclick="toggleVendorSms(${i})">${v.sms?'문자 O':'문자 X'}</button>
      <span class="del-btn" onclick="deleteVendor(${i})">🗑</span>
    </div>`).join('');

}

function updateSummary() {
  let todayCnt=0, soonCnt=0, qtyCnt=0, total=0;
  state.categories.forEach(cat => cat.items.forEach(item => {
    total++;
    if(item.qty > 0) qtyCnt++;
    const s = getSuggest(item, cat.id);
    if(s.type==='today') todayCnt++;
    if(s.type==='soon') soonCnt++;
  }));
  document.getElementById('sumToday').textContent = todayCnt;
  document.getElementById('sumSoon').textContent = soonCnt;
  document.getElementById('sumQty').textContent = qtyCnt;
  document.getElementById('sumTotal').textContent = total;
}

function updateFinalBtn() {
  let cnt = 0;
  state.categories.forEach(cat => cat.items.forEach(item => { if(item.qty>0) cnt++; }));
  document.getElementById('finalCount').textContent = cnt;
  const btn = document.getElementById('finalBtn');
  btn.className = 'final-btn' + (cnt > 0 ? ' ready' : '');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab === 'settings') renderVendorSettings();
}

function toggleCat(catId) {
  const cat = state.categories.find(c => c.id===catId);
  if(cat) { cat.open = !cat.open; save(); renderCategories(); }
}

function toggleSort(e, catId) {
  e.stopPropagation();
  sortingCatId = sortingCatId===catId ? null : catId;
  renderCategories();
}

function stepQty(catId, itemId, delta) {
  const item = state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  if(item) { item.qty = Math.max(0, (item.qty||0) + delta); save(); renderCategories(); }
}

function changeField(catId, itemId, field, val) {
  const item = state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  if(item) { item[field] = val; save(); }
}

function addItem(catId) {
  const input = document.getElementById('addInput_'+catId);
  if(!input || !input.value.trim()) return;
  const cat = state.categories.find(c=>c.id===catId);
  const defVendor = cat.items[0]?.vendor || state.vendors[0]?.name || '식자재업체';
  cat.items.push({
    id: catId+'_'+Date.now(), name: input.value.trim(),
    vendor: defVendor, unit: '개', cycle: 14,
    lastOrder: null, orders: [], qty: 0
  });
  input.value = ''; save(); renderCategories();
}

function askDelete(catId, itemId) {
  pendingDelCat=catId; pendingDelItem=itemId;
  const item = state.categories.find(c=>c.id===catId)?.items.find(i=>i.id===itemId);
  document.getElementById('deleteMsg').textContent = `"${item?.name}" 을(를) 삭제하시겠습니까? 발주 이력도 함께 삭제됩니다.`;
  document.getElementById('deleteModal').classList.add('show');
}

function confirmDelete() {
  const cat = state.categories.find(c=>c.id===pendingDelCat);
  if(cat) cat.items = cat.items.filter(i=>i.id!==pendingDelItem);
  save(); closeModal('deleteModal'); renderCategories();
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function dragStart(e, catId, idx) { dragSrcIdx=idx; e.dataTransfer.effectAllowed='move'; }
function dragOver(e) { e.preventDefault(); }
function dragDrop(e, catId, idx) {
  e.preventDefault();
  if(dragSrcIdx===null || dragSrcIdx===idx) return;
  const cat = state.categories.find(c=>c.id===catId);
  const moved = cat.items.splice(dragSrcIdx,1)[0];
  cat.items.splice(idx,0,moved);
  dragSrcIdx=null; save(); renderCategories();
}

// ── 발주 모달 & 발송 ────────────────────────────────────────
function openOrderModal() {
  const groups = {};
  state.categories.forEach(cat => {
    cat.items.forEach(item => {
      if(item.qty <= 0) return;
      if(!groups[item.vendor]) groups[item.vendor] = [];
      groups[item.vendor].push(item);
    });
  });
  const keys = Object.keys(groups);
  if(keys.length === 0) { alert('수량이 입력된 품목이 없습니다.'); return; }

  const preview = keys.map(vendor => {
    const v = state.vendors.find(v=>v.name===vendor);
    const tag = v?.sms
      ? '<span class="sms-tag">문자 발송</span>'
      : '<span class="nosms-tag">문자 제외</span>';
    const items = groups[vendor].map(i=>`<div class="vitem">${i.name} ${i.qty}${i.unit}</div>`).join('');
    return `<div class="order-preview"><div class="vname">${vendor} ${tag}</div>${items}</div>`;
  }).join('');

  document.getElementById('orderPreview').innerHTML = preview;
  document.getElementById('sendStatus').innerHTML = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = false; btn.textContent = '문자 발송';
  document.getElementById('orderModal').classList.add('show');
}

async function sendOrder() {
  const appsUrl = state.appsUrl;
  if(!appsUrl) {
    document.getElementById('sendStatus').innerHTML = '<div class="send-status err">⚠️ 설정 탭에서 Apps Script URL을 입력해주세요.</div>';
    return;
  }
  const btn = document.getElementById('sendBtn');
  btn.disabled=true; btn.textContent='발송 중...';

  const groups = {};
  state.categories.forEach(cat => {
    cat.items.forEach(item => {
      if(item.qty <= 0) return;
      const v = state.vendors.find(v=>v.name===item.vendor);
      if(!v?.sms) return;
      if(!groups[item.vendor]) groups[item.vendor]=[];
      groups[item.vendor].push({name:item.name, qty:item.qty, unit:item.unit});
    });
  });

  const orders = Object.keys(groups).map(vendor => ({vendor, items: groups[vendor]}));

  try {
    // 현금마감과 동일: Content-Type 헤더 없이 POST → CORS preflight 생략
    const res = await fetch(appsUrl + '?action=sendOrder', {
      method: 'POST',
      body: JSON.stringify(orders)
    });
    const data = await res.json();
    if(!data.success) throw new Error(JSON.stringify(data));
  } catch(e) {
    document.getElementById('sendStatus').innerHTML = `<div class="send-status err">발송 실패: ${e.message}</div>`;
    btn.disabled=false; btn.textContent='다시 시도';
    return;
  }

  const t = today();
  state.categories.forEach(cat => {
    cat.items.forEach(item => {
      if(item.qty > 0) {
        item.lastOrder = t;
        if(!item.orders) item.orders=[];
        item.orders.push(t);
        if(item.orders.length > 20) item.orders = item.orders.slice(-20);
        item.qty = 0;
      }
    });
  });
  save();
  document.getElementById('sendStatus').innerHTML = '<div class="send-status ok">✅ 발주 완료! 수량이 초기화되었습니다.</div>';
  btn.textContent='완료';
  setTimeout(()=>{ closeModal('orderModal'); renderCategories(); }, 1500);
}

// ── 초기화 ──────────────────────────────────────────────────
document.getElementById('todayDate').textContent =
  new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
renderCategories();

</script>
